<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard — Savory Bites Admin</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<body class="app">
<aside class="sidebar" id="sidebar">
